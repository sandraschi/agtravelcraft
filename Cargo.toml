[workspace]
members = [
    "crates/agtravelcraft-core",
    "crates/agtravelcraft-mcp",
    "crates/agtravelcraft-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["Sandra Schipal <sandraschipal@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sandraschi/agtravelcraft"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
rusqlite = { version = "0.34", features = ["bundled", "modern_sqlite"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
